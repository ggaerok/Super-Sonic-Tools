<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A15">
<title>수퍼소닉 도구 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 모바일 우선 단일 컬럼(최대 560px). 별이 흐르는 우주 배경 위에 행성 로고 헤더, 아래로 2열 박스 버튼이 계속 늘어나는 구조 */
:root{
  --space:#070A15;
  --surface:#10162B;
  --surface-2:#0B1021;
  --line:#242D50;
  --fg:#E9EDFB;
  --muted:#8E99BD;
  --accent:#9DBBFF;
  --ring:#6F7FB8;
  --c-ember:#FF9F6B;
  --c-lagoon:#6FD6C6;
  --c-lilac:#C4A6FF;
  --c-sun:#FFD36B;
  --c-sky:#7CC4FF;
  --c-rose:#FF7A8E;
  --c-mint:#8EE29C;
  --c-sand:#E3B98A;
  --c-pink:#FF9ED2;
  --c-lime:#C6E86B;
  --font-display:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--space)}
body{
  background:var(--space);
  background-image:
    radial-gradient(120% 60% at 85% -10%, #1B2550 0%, transparent 60%),
    radial-gradient(90% 50% at 0% 100%, #141B3E 0%, transparent 65%);
  background-attachment:fixed;
  color:var(--fg);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  min-height:100%;
  padding-block:0 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:14px}
::selection{background:#2A3A78;color:#fff}

header{padding-block:40px 28px;position:relative}
.planet{
  position:absolute;
  right:-6px;top:22px;
  width:104px;height:auto;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:.14em;
  color:var(--muted);
  margin:0 0 14px;
  text-transform:uppercase;
}
h1{
  font-family:var(--font-display);
  font-stretch:118%;
  font-weight:800;
  font-size:clamp(30px,9.4vw,44px);
  line-height:1.12;
  letter-spacing:-.01em;
  margin:0;
  max-width:11ch;
  text-wrap:balance;
}
.lede{margin:14px 0 0;color:var(--muted);font-size:14px;max-width:30ch}

/* 바로가기: 기존 박스 2개 폭(전체 폭)을 8칸으로 나눈 정사각형 한 줄 */
.quick{
  list-style:none;
  margin:0 0 18px;
  padding:0;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:clamp(4px,1.4vw,8px);
}
.q{
  aspect-ratio:1/1;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:0;
  border-radius:clamp(8px,2.4vw,12px);
  background:linear-gradient(165deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);
  text-align:center;
  transition:transform .16s ease,border-color .16s ease;
}
a.q:hover,a.q:active{transform:translateY(-2px);border-color:var(--accent)}
.q .e{
  font-size:clamp(14px,4.4vw,24px);
  line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.q .t{
  font-size:clamp(9px,2.6vw,12px);
  line-height:1.15;
  font-weight:700;
  white-space:nowrap;
}
.q.off{border-style:dashed;color:var(--muted);opacity:.7}
.q.off .t{font-weight:500}

.grid{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.tile{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:64px;
  height:100%;
  padding:10px 12px;
  border-radius:16px;
  background:linear-gradient(165deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);
  transition:transform .16s ease,border-color .16s ease;
}
.tile:hover,.tile:active{transform:translateY(-2px);border-color:var(--accent)}
.orb{
  flex:none;
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  font-size:23px;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--c) 28%,transparent) 0%, color-mix(in srgb,var(--c) 8%,transparent) 70%);
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 28%,transparent);
}
/* 한 박스를 3칸으로 나눈 버튼 */
.tile.split{
  padding:0;
  gap:0;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:stretch;
  overflow:hidden;
}
.tile.split:hover,.tile.split:active{transform:none}
.seg{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:8px 2px;
  margin:0;
  border:0;
  border-radius:0;
  background:transparent;
  color:var(--fg);
  font:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.seg + .seg{border-left:1px solid var(--line)}
.seg:hover,.seg:active{background:color-mix(in srgb,var(--c) 16%,transparent)}
.seg:focus-visible{outline-offset:-4px}
.seg .e{
  font-size:clamp(18px,5vw,22px);
  line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.seg .t{
  font-size:clamp(9.5px,2.8vw,11.5px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.03em;
  white-space:nowrap;
}

/* 3칸 버튼이 여러 개일 때 구분하는 이름표 */
.has-tag{position:relative}
.tag{
  position:absolute;
  top:-7px;
  left:14px;
  z-index:1;
  padding:0 7px;
  border-radius:999px;
  background:var(--surface-2);
  border:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:9.5px;
  line-height:14px;
  letter-spacing:.06em;
  color:var(--muted);
  pointer-events:none;
}

/* QR 팝업 */
.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(4,7,16,.78);
}
.modal{overflow:auto}
.modal .card{
  width:fit-content;
  max-width:100%;
  margin:auto;
  display:grid;
  justify-items:center;
  gap:10px;
  padding:14px 14px 12px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--line);
  text-align:center;
}
.modal h2{margin:0;font-size:16px;font-weight:700}
/* 최대 900px. 화면이 작으면 세로·가로에 맞춰 줄어듭니다. */
.modal img{
  width:min(900px,calc(100vh - 190px),calc(100vw - 64px));
  width:min(900px,calc(100dvh - 190px),calc(100vw - 64px));
  height:auto;
  aspect-ratio:1/1;
  border-radius:10px;
  background:#fff;
  image-rendering:pixelated;
}
.modal .u{margin:0;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.modal .close{
  font:inherit;
  font-weight:700;
  padding:9px 24px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--fg);
  cursor:pointer;
}
.modal .close:hover{border-color:var(--accent)}
.meta{min-width:0;flex:1}
.name{
  font-weight:700;
  font-size:14px;
  letter-spacing:-.02em;
  line-height:1.3;
  overflow-wrap:anywhere;
  word-break:keep-all;
}

footer{
  margin-top:36px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
@media (max-width:399px){
  .tile{gap:8px;padding:8px 10px}
  .orb{width:36px;height:36px;font-size:20px}
}
@media (min-width:420px){
  .tile{padding:10px 14px}
  .planet{width:124px}
}
@media (prefers-reduced-motion: reduce){
  .tile,.q{transition:none}
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>

</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <svg class="planet" viewBox="0 0 120 90" aria-hidden="true">
      <defs>
        <radialGradient id="pg" cx="34%" cy="30%" r="75%">
          <stop offset="0" stop-color="#FFE3B8"/>
          <stop offset=".5" stop-color="#E8905E"/>
          <stop offset="1" stop-color="#4A2A3F"/>
        </radialGradient>
        <clipPath id="front"><rect x="0" y="45" width="120" height="45"/></clipPath>
      </defs>
      <ellipse cx="60" cy="45" rx="56" ry="13" fill="none" stroke="var(--ring)" stroke-width="2" transform="rotate(-18 60 45)" opacity=".55"/>
      <circle cx="60" cy="45" r="26" fill="url(#pg)"/>
      <ellipse cx="60" cy="45" rx="56" ry="13" fill="none" stroke="var(--ring)" stroke-width="2.4" transform="rotate(-18 60 45)" clip-path="url(#front)"/>
    </svg>
    <p class="eyebrow" id="count">LINKS</p>
    <h1>수퍼소닉<br>도구 모음</h1>
    <p class="lede">탭하면 새 탭에서 열립니다.</p>
  </header>

  <ul class="quick" id="quick" aria-label="바로가기"></ul>

  <ul class="grid" id="grid"></ul>

  <footer>수퍼소닉 도구 모음</footer>
</div>

<div class="modal" id="qrm" hidden role="dialog" aria-modal="true" aria-labelledby="qrt">
  <div class="card">
    <h2 id="qrt">QR코드</h2>
    <img id="qri" alt="QR 코드" width="240" height="240">
    <p class="u" id="qru"></p>
    <button type="button" class="close" id="qrc">닫기</button>
  </div>
</div>

<script>
/* 박스 버튼 데이터: 새 링크는 이 배열 끝에 한 줄씩 추가하면 아래로 계속 늘어납니다. */
var TOOLS = [

  { name: "코스믹코드 제작",     url: "https://nysc-space-message.vercel.app",     icon: "✉️", color: "var(--c-lagoon)" },
  { name: "플라네타리움",      url: "https://nysc-planetarium.vercel.app",       icon: "🌍", color: "var(--c-lilac)" },

  { name: "비행기 타겟",       url: "https://nysc-airplane-target.vercel.app",   icon: "✈️", color: "var(--c-sky)" },
  { name: "회전하는 물체 그리고 공전 기록",        url: "https://nysc-revolution.vercel.app",        icon: "🏆", color: "var(--c-rose)" },
  { name: "팀 뽑기 게임",       url: "https://nyscdart.vercel.app",               icon: "🎯", color: "var(--c-mint)" },
  { name: "좌석배치표",         url: "https://nyscseatingchart.vercel.app",       icon: "🪑", color: "var(--c-sand)" },
  /* parts가 있으면 한 박스가 여러 칸으로 나뉩니다. qrOf는 QR로 만들 칸의 번호(0부터)입니다. */
  { name: "게임 1", color: "var(--c-pink)", parts: [
    { name: "게임관리", icon: "⚙️", url: "https://nyscgame1.vercel.app" },
    { name: "게임실행", icon: "▶️", url: "https://nyscgame1.vercel.app/play" },
    { name: "QR코드",   icon: "📱", qrOf: 1 }
  ] },
  { name: "게임 2", color: "var(--c-lime)", parts: [
    { name: "게임관리", icon: "⚙️", url: "https://nyscgame2.vercel.app/" },
    { name: "게임진행", icon: "▶️", url: "https://nyscgame2.vercel.app/play" },
    { name: "QR코드",   icon: "📱", qrOf: 1 }
  ] }
];

/* QR 그림: 게임 진행(실행) 주소를 QR로 만든 PNG입니다. 주소가 바뀌면 새로 만들어 교체해야 합니다. */

  "https://nyscgame1.vercel.app/play": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3gAAAN4AQMAAACroNgNAAAABlBMVEULECH///+3cDDHAAAC3ElEQVR42u3dvW6DMBSA0au+/zunQ6UI+f7YIVHU4TBEbSCcgeWTwSYe392Cx+PxeDwej8fj8Xg8Ho/H4/F4PB6Px+PxeDwej8fj8Xg8Ho/3OS+q7bnreUA++OQMf9tPfHfj8Xg8Ho/H4/0vb+3PNU9Tdl7/Xb4czqA/eTwej8fj8Xhdf153LZ/5yyUyuzPoTx6Px+PxeDzeq/05DISWpao/eTwej8fj8Xj3+nP5snvUU3/yeDwej8fj8W70Z/nN8MfhGfQnj8fj8Xg8Hi/3Z3nAS58z4frxeDwej8fj6c/9Ik3p4KVOD8+jP3k8Ho/H4/H05+H6S8MN90jPfJbJqj95PB6Px+PxeHNwbkc7y/OUR+pPHo/H4/F4PN7cn9GMag4T5Id5SfqTx+PxeDwej1f2ZzluudRmHKza1FWo68fj8Xg8Ho+nP7sFl64H5F/lvV276k8ej8fj8Xg83tCf15jcPs9ZjnxG874k/cnj8Xg8Ho+nP7uxym2CLpna/cT9dx6Px+PxeDzetj+ve/Pf3duRliIN79/k8Xg8Ho/H4439OU+En2cqdS1q/JPH4/F4PB6P1/VnV5vL8fnneVe3BL3rx+PxeDwej6c/55WXuvvpXYt246L6k8fj8Xg8Ho8X40qe0Sy+FOPoqPe/83g8Ho/H4/Fe6s9hLaZhqlE+bUm4fjwej8fj8Xj6c7tFtS5TjGs3hfcf8Xg8Ho/H4/F2/TkfEP0L359HRj/yqT95PB6Px+PxeDHef59XpB/W+Yxm8pH+5PF4PB6Px9Ofw/yj7buNonn483pAeP6Tx+PxeDwej3erP09qc7twvevH4/F4PB6Ppz9P+rNb2DPStKPh/PqTx+PxeDweT3++//xnOSm+K1jXj8fj8Xg8Hk9/bgcwI91S784wTz7Snzwej8fj8Xj68/Hdjcfj8Xg8Ho/H4/F4PB6Px+PxeDwej8fj8Xg8Ho/H4/F4PB6P9972C5GugavpvP8IAAAAAElFTkSuQmCC"
};

/* 바로가기 8칸: url이 없으면 '준비' 칸으로 표시됩니다. */
var QUICK = [
  { name: "날씨", url: "https://www.weather.go.kr",           icon: "⛅" },
  { name: "설문", url: "https://nysc.tistory.com",            icon: "📝" },
  { name: "천문", url: "https://astro.kasi.re.kr",            icon: "🔭" },
  { name: "지도", url: "https://naver.me/5Z1tTNBY", icon: "🗺️" },
  { name: "음악", url: "https://www.youtube.com/@chartdoong2", icon: "🎵" },
  { name: "구글", url: "https://www.google.com/",             icon: "🔍" },
  { name: "광장", url: "https://nysc.kywa.or.kr/nysc_vr/explorer/index.html#scene=18&mode=photo", icon: "🏛️" },
  { name: "준비", icon: "⏳" }
];
var quick = document.getElementById("quick");
QUICK.forEach(function(q){
  var li = document.createElement("li");
  var el;
  if (q.url){
    el = document.createElement("a");
    el.className = "q";
    el.href = q.url; el.target = "_blank"; el.rel = "noopener noreferrer";
    el.setAttribute("aria-label", q.name + " 열기");
  } else {
    el = document.createElement("div");
    el.className = "q off";
    el.setAttribute("aria-disabled", "true");
  }
  var e = document.createElement("span"); e.className = "e"; e.textContent = q.icon; e.setAttribute("aria-hidden", "true");
  var t = document.createElement("span"); t.className = "t"; t.textContent = q.name;
  el.appendChild(e); el.appendChild(t);
  li.appendChild(el);
  quick.appendChild(li);
});

var grid = document.getElementById("grid");
function host(u){ try { return new URL(u).hostname; } catch (e) { return u; } }
function svgArrow(){
  var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", "14"); s.setAttribute("height", "14"); s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2.2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("aria-hidden", "true");
  var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", "M7 17L17 7M9 7h8v8");
  s.appendChild(p);
  return s;
}
function div(cls, text){ var d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }

/* QR 팝업 */
var qrm = document.getElementById("qrm"), qri = document.getElementById("qri"),
    qru = document.getElementById("qru"), qrt = document.getElementById("qrt"),
    qrc = document.getElementById("qrc"), qrFrom = null;
function openQr(url, title, from){
  qrFrom = from || null;
  qrt.textContent = title;
  qru.textContent = url;
  if (QR_IMAGES[url]) { qri.src = QR_IMAGES[url]; qri.hidden = false; }
  else { qri.removeAttribute("src"); qri.hidden = true; }
  qrm.hidden = false;
  qrc.focus();
}
function closeQr(){
  qrm.hidden = true;
  if (qrFrom) { try { qrFrom.focus(); } catch (e) {} }
}
qrc.addEventListener("click", closeQr);
qrm.addEventListener("click", function(ev){ if (ev.target === qrm) closeQr(); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape" && !qrm.hidden) closeQr(); });

TOOLS.forEach(function(t){
  var li = document.createElement("li");
  if (t.parts){
    var box = div("tile split"); box.style.setProperty("--c", t.color);
    t.parts.forEach(function(p){
      var el;
      if (p.qrOf != null){
        var target = t.parts[p.qrOf];
        el = document.createElement("button");
        el.type = "button";
        el.setAttribute("aria-label", target.name + " " + p.name + " 보기");
        el.addEventListener("click", function(){ openQr(target.url, target.name + " " + p.name, el); });
      } else {
        el = document.createElement("a");
        el.href = p.url; el.target = "_blank"; el.rel = "noopener noreferrer";
        el.setAttribute("aria-label", t.name + " " + p.name + " 열기");
      }
      el.className = "seg";
      var e = document.createElement("span"); e.className = "e"; e.textContent = p.icon; e.setAttribute("aria-hidden", "true");
      var s = document.createElement("span"); s.className = "t"; s.textContent = p.name;
      el.appendChild(e); el.appendChild(s);
      box.appendChild(el);
    });
    li.className = "has-tag";
    li.appendChild(box);
    li.appendChild(div("tag", t.name));
    grid.appendChild(li);
    return;
  }
  var a = document.createElement("a");
  a.className = "tile";
  a.href = t.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", t.name + " 열기");
  var orb = div("orb", t.icon); orb.style.setProperty("--c", t.color);
  orb.setAttribute("aria-hidden", "true");
  var meta = div("meta");
  meta.appendChild(div("name", t.name));
  a.appendChild(orb);
  a.appendChild(meta);
  li.appendChild(a);
  grid.appendChild(li);
});
document.getElementById("count").textContent = "LINKS · " + String(TOOLS.length).padStart(2, "0");

/* 별 배경 */
(function(){
  var cv = document.getElementById("stars");
  var ctx = cv.getContext("2d");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stars = [], w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function seed(){
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round((w * h) / 5200);
    stars = [];
    for (var i = 0; i < n; i++){
      stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .25, p: Math.random() * 6.28, s: Math.random() * .0016 + .0004 });
    }
  }
  function draw(t){
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var a = reduce ? .6 : .35 + .55 * (.5 + .5 * Math.sin(s.p + t * s.s));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#E9EDFB";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  seed(); draw(0);
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ seed(); if (reduce) draw(0); }, 150); });
})();
</script>
