<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A15">
<title>수퍼소닉 도구 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 모바일 우선 단일 컬럼(최대 560px). 별이 흐르는 우주 배경 위에 행성 로고 헤더, 아래로 2열 박스 버튼이 계속 늘어나는 구조 */
:root{
  --space:#070A15;
  --surface:#10162B;
  --surface-2:#0B1021;
  --line:#242D50;
  --fg:#E9EDFB;
  --muted:#8E99BD;
  --accent:#9DBBFF;
  --ring:#6F7FB8;
  --c-ember:#FF9F6B;
  --c-lagoon:#6FD6C6;
  --c-lilac:#C4A6FF;
  --c-sun:#FFD36B;
  --c-sky:#7CC4FF;
  --c-rose:#FF7A8E;
  --c-mint:#8EE29C;
  --c-sand:#E3B98A;
  --c-pink:#FF9ED2;
  --c-lime:#C6E86B;
  --font-display:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--space)}
body{
  background:var(--space);
  background-image:
    radial-gradient(120% 60% at 85% -10%, #1B2550 0%, transparent 60%),
    radial-gradient(90% 50% at 0% 100%, #141B3E 0%, transparent 65%);
  background-attachment:fixed;
  color:var(--fg);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  min-height:100%;
  padding-block:0 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:14px}
::selection{background:#2A3A78;color:#fff}

header{padding-block:40px 28px;position:relative}
.planet{
  position:absolute;
  right:-6px;top:22px;
  width:104px;height:auto;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:.14em;
  color:var(--muted);
  margin:0 0 14px;
  text-transform:uppercase;
}
h1{
  font-family:var(--font-display);
  font-stretch:118%;
  font-weight:800;
  font-size:clamp(30px,9.4vw,44px);
  line-height:1.12;
  letter-spacing:-.01em;
  margin:0;
  max-width:11ch;
  text-wrap:balance;
}
.lede{margin:14px 0 0;color:var(--muted);font-size:14px;max-width:30ch}

/* 바로가기: 기존 박스 2개 폭(전체 폭)을 8칸으로 나눈 정사각형 한 줄 */
.quick{
  list-style:none;
  margin:0 0 18px;
  padding:0;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:clamp(4px,1.4vw,8px);
}
.q{
  aspect-ratio:1/1;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:0;
  border-radius:clamp(8px,2.4vw,12px);
  background:linear-gradient(165deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);
  text-align:center;
  transition:transform .16s ease,border-color .16s ease;
}
a.q:hover,a.q:active{transform:translateY(-2px);border-color:var(--accent)}
.q .e{
  font-size:clamp(14px,4.4vw,24px);
  line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.q .t{
  font-size:clamp(9px,2.6vw,12px);
  line-height:1.15;
  font-weight:700;
  white-space:nowrap;
}
.q.off{border-style:dashed;color:var(--muted);opacity:.7}
.q.off .t{font-weight:500}

.grid{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.tile{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:64px;
  height:100%;
  padding:10px 12px;
  border-radius:16px;
  background:linear-gradient(165deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);
  transition:transform .16s ease,border-color .16s ease;
}
.tile:hover,.tile:active{transform:translateY(-2px);border-color:var(--accent)}
.tile.ready{opacity:.55;cursor:default}
.tile.ready:hover,.tile.ready:active{transform:none;border-color:var(--line)}
.tile.ready .orb{--c:var(--muted);filter:grayscale(1)}
.orb{
  flex:none;
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  font-size:23px;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--c) 28%,transparent) 0%, color-mix(in srgb,var(--c) 8%,transparent) 70%);
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 28%,transparent);
}
/* 한 박스를 3칸으로 나눈 버튼 */
.tile.split{
  padding:0;
  gap:0;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:30px minmax(0,1fr);
  align-items:stretch;
  overflow:hidden;
}
.tile.split:hover,.tile.split:active{transform:none}
/* 윗부분 제목 줄: 박스 크기는 그대로 두고 안쪽 위를 나눠 씁니다 */
.head{
  grid-column:1 / -1;
  display:flex;
  align-items:center;
  padding:0 10px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--c) 10%,transparent);
  overflow:hidden;
}
.head .ttl{font-family:var(--font-display);font-weight:800;font-size:clamp(11px,3.3vw,13px);letter-spacing:.01em;color:var(--c);white-space:nowrap;line-height:1}
.head .logo{display:block;height:22px;width:auto;aspect-ratio:var(--ar)}
.seg{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:3px 2px;
  margin:0;
  border:0;
  border-radius:0;
  background:transparent;
  color:var(--fg);
  font:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.seg + .seg{border-left:1px solid var(--line)}
.seg:hover,.seg:active{background:color-mix(in srgb,var(--c) 16%,transparent)}
.seg:focus-visible{outline-offset:-4px}
.seg .t{
  font-size:clamp(10px,3vw,12px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.03em;
  white-space:nowrap;
}

/* QR 팝업 */
.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(4,7,16,.78);
}
.modal{overflow:auto}
.modal .card{
  width:fit-content;
  max-width:100%;
  margin:auto;
  display:grid;
  justify-items:center;
  gap:10px;
  padding:14px 14px 12px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--line);
  text-align:center;
}
.modal h2{margin:0;font-size:16px;font-weight:700}
/* 최대 900px. 화면이 작으면 세로·가로에 맞춰 줄어듭니다. */
.modal img{
  width:min(900px,calc(100vh - 190px),calc(100vw - 64px));
  width:min(900px,calc(100dvh - 190px),calc(100vw - 64px));
  height:auto;
  aspect-ratio:1/1;
  border-radius:10px;
  background:#fff;
  image-rendering:pixelated;
}
.modal .u{margin:0;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.modal .close{
  font:inherit;
  font-weight:700;
  padding:9px 24px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--fg);
  cursor:pointer;
}
.modal .close:hover{border-color:var(--accent)}
.meta{min-width:0;flex:1}
.name{
  font-weight:700;
  font-size:14px;
  letter-spacing:-.02em;
  line-height:1.3;
  overflow-wrap:anywhere;
  word-break:keep-all;
}

@media (max-width:359px){.tile.long .orb{display:none}.tile.long .name{font-size:12.5px;line-height:1.2}}
.tile.has-note{gap:7px;padding-top:6px;padding-bottom:6px}
@media (max-width:419px){.tile.has-note .orb{display:none}}
.tile.has-note .orb{width:32px;height:32px;font-size:17px}
.tile.has-note .name{font-size:12.5px;line-height:1.2}
.note{white-space:nowrap;margin-top:2px;font-size:10.5px;font-weight:700;line-height:1.2;letter-spacing:-.02em;color:var(--c-rose)}
/* 업데이트 현황 */
.upd-btn{
  position:absolute;right:0;top:128px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 13px 0 11px;
  font:700 12.5px/1 var(--font-body);letter-spacing:-.02em;white-space:nowrap;
  color:var(--fg);cursor:pointer;
  border-radius:999px;border:1px solid var(--line);
  background:linear-gradient(165deg,var(--surface),var(--surface-2));
  box-shadow:0 0 18px color-mix(in srgb,var(--accent) 16%,transparent);
  transition:border-color .16s ease,transform .16s ease;
}
.upd-btn:hover,.upd-btn:active{border-color:var(--accent);transform:translateY(-1px)}
.upd-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--c-lagoon);box-shadow:0 0 8px var(--c-lagoon)}
.um .sheet{
  width:min(420px,100%);max-height:min(86vh,780px);max-height:min(86dvh,780px);
  display:flex;flex-direction:column;overflow:hidden;
  border-radius:20px;background:linear-gradient(170deg,var(--surface),var(--surface-2));border:1px solid var(--line);
}
.um .bar{display:flex;align-items:center;gap:8px;padding:13px 14px 12px 16px;border-bottom:1px solid var(--line);flex:none}
.um .bar h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.um .all{
  font:700 12px/1 var(--font-body);height:28px;padding:0 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted);
}
.um .all[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.um .all:hover{border-color:var(--accent)}
.um .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px;line-height:1;cursor:pointer}
.um .x:hover{border-color:var(--accent);color:var(--fg)}
.um .flt{flex:none;padding:8px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.um .flt b{color:var(--fg)}
.um .list{overflow:auto;padding:4px 12px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.um .row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.um .row:nth-child(odd){background:rgba(255,255,255,.02)}
.um .d{text-align:center;line-height:1.1}
.um .d b{display:block;font:700 20px var(--font-mono);color:var(--fg)}
.um .d span{font-size:11px;color:var(--muted)}
.um .h{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
.um .tn{
  font:800 14.5px/1.3 var(--font-body);letter-spacing:-.02em;color:var(--c);
  background:none;border:0;padding:0;cursor:pointer;
  text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c) 40%,transparent);text-underline-offset:3px;
}
.um .tn[aria-current="true"]{text-decoration-thickness:2px;text-decoration-color:var(--c)}
.um .tn + .tn:before{content:"·";color:var(--muted);margin-right:6px;text-decoration:none;display:inline-block}
.um .who{font-size:12.5px;color:var(--muted)}
.um .bd{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
.um .bd.add{background:rgba(142,226,156,.14);color:var(--c-mint)}
.um .bd.chg{background:rgba(124,196,255,.14);color:var(--c-sky)}
.um .bd.imp{background:rgba(196,166,255,.14);color:var(--c-lilac)}
.um .bd.test{background:rgba(255,122,142,.14);color:var(--c-rose)}
.um .tx{font-size:15px;line-height:1.5;color:var(--fg)}
.um .nt{margin-top:2px;font-size:12.5px;color:var(--muted)}
.um .none{padding:28px 8px;text-align:center;color:var(--muted)}
/* 도구별 최신 소식 한 줄 (구글 시트에서 읽어옴) */
.tile.two{padding:0;gap:0;display:grid;grid-template-rows:minmax(0,1fr) 21px;min-height:64px;height:100%;overflow:hidden}
.tile.two .tmain{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:0}
.tile.two .orb{width:30px;height:30px;font-size:17px;flex:none}
.tile.two .name{font-size:13.5px;line-height:1.2}
.lastbar,.sinfo{display:flex;align-items:center;padding:0 10px;font-size:10px;line-height:1;color:var(--muted);white-space:nowrap;overflow:hidden;border-top:1px solid var(--line);background:color-mix(in srgb,var(--c,var(--accent)) 9%,transparent)}
.lastbar{padding:0 12px}
.lastbar.empty,.sinfo.empty{opacity:.5}
.lastbar i,.sinfo i{font:normal 700 9.5px var(--font-mono);color:var(--accent);margin-right:5px;flex:none}
.lastbar span,.sinfo span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sinfo{grid-column:1 / -1}
.tile.split.has-last{grid-template-rows:30px minmax(0,1fr) 21px;min-height:84px}
/* 소식 두 줄 표시 */
.tile.two.nolast{grid-template-rows:minmax(0,1fr)}
.tile.two{grid-template-rows:minmax(0,1fr) 32px;min-height:74px}
.lastbar,.sinfo{align-items:center;line-height:1.3}
.lastbar i,.sinfo i{align-self:center}
.lastbar span,.sinfo span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.tile.split.has-last{grid-template-rows:30px minmax(0,1fr) 32px;min-height:95px}
footer{
  margin-top:36px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
@media (max-width:399px){
  .tile{gap:8px;padding:8px 10px}
  .orb{width:36px;height:36px;font-size:20px}
}
@media (min-width:420px){
  .tile{padding:10px 14px}
  .planet{width:124px}
}
@media (prefers-reduced-motion: reduce){
  .tile,.q{transition:none}
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>

</head>

    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = ""; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function normDate(s){
  var m = String(s || "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2) : "";
}
function splitList(s){ return String(s || "").split(/[,，、]/).map(function(x){ return x.trim(); }).filter(Boolean); }
function sheetToUpdates(text){
  var rows = parseCsv(text), head = rows.shift() || [], col = {};
  head.forEach(function(n, k){ col[String(n).trim()] = k; });
  if (col["날짜"] == null || col["내용"] == null) return null;
  var out = [];
  rows.forEach(function(r){
    var d = normDate(r[col["날짜"]]), text = (r[col["내용"]] || "").trim();
    if (!d || !text) return;
    var tools = splitList(col["도구"] != null ? r[col["도구"]] : "");
    var types = splitList(col["종류"] != null ? r[col["종류"]] : "").map(function(t){ return UP_TYPE_KEY[t]; }).filter(Boolean);
    var u = { d: d, tools: tools.length ? tools : ["기타"], type: types, text: text };
    if (col["비고"] != null && (r[col["비고"]] || "").trim()) u.note = r[col["비고"]].trim();
    var wc = col["제안자"] != null ? col["제안자"] : col["담당"];
    if (wc != null && (r[wc] || "").trim()) u.who = r[wc].trim();
    u.tools.forEach(function(t){ if (!UP_COLOR[t]) UP_COLOR[t] = UP_PALETTE[upExtra++ % UP_PALETTE.length]; });
    out.push(u);
  });
  out = out.map(function(u, k){ return { u: u, k: k }; })
    .sort(function(a, b){ return a.u.d < b.u.d ? 1 : a.u.d > b.u.d ? -1 : a.k - b.k; })
    .map(function(x){ return x.u; });
  return out.length ? out : null;
}
function loadSheet(){
  if (!SHEET_URL || Date.now() - upLoadedAt < 30000) return;
  upLoadedAt = Date.now();
  fetch(SHEET_URL, { cache: "no-store" }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(t){
      var list = sheetToUpdates(t);
      if (!list) return;
      UPDATES = list;
      refreshTileInfo();
      if (umFilter && !UPDATES.some(function(u){ return u.tools.indexOf(umFilter) !== -1; })) umFilter = null;
      renderUpdates();
    })
    .catch(function(){ upLoadedAt = 0; });
}
function openUpdates(){
  umFilter = null; renderUpdates(); umList.scrollTop = 0; loadSheet();
  um.hidden = false; document.body.style.overflow = "hidden"; umX.focus();
}
function closeUpdates(){
  um.hidden = true; document.body.style.overflow = "";
  try { updBtn.focus(); } catch (e) {}
}
updBtn.addEventListener("click", openUpdates);
umX.addEventListener("click", closeUpdates);
umAll.addEventListener("click", function(){ umFilter = null; renderUpdates(); umList.scrollTop = 0; });
um.addEventListener("click", function(ev){ if (ev.target === um) closeUpdates(); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape" && !um.hidden) closeUpdates(); });
loadSheet();

(function(){
  var cv = document.getElementById("stars");
  var ctx = cv.getContext("2d");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stars = [], w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function seed(){
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round((w * h) / 5200);
    stars = [];
    for (var i = 0; i < n; i++){
      stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .25, p: Math.random() * 6.28, s: Math.random() * .0016 + .0004 });
    }
  }
  function draw(t){
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var a = reduce ? .6 : .35 + .55 * (.5 + .5 * Math.sin(s.p + t * s.s));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#E9EDFB";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  seed(); draw(0);
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ seed(); if (reduce) draw(0); }, 150); });
})();
</script>
