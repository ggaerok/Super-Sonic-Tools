<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A15">
<title>수퍼소닉 도구 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 모바일 우선 단일 컬럼(최대 560px). 별이 흐르는 우주 배경 위에 행성 로고 헤더, 아래로 2열 박스 버튼이 계속 늘어나는 구조 */
:root{
  --space:#070A15;
  --surface:#10162B;
  --surface-2:#0B1021;
  --line:#242D50;
  --fg:#E9EDFB;
  --muted:#8E99BD;
  --accent:#9DBBFF;
  --ring:#6F7FB8;
  --c-ember:#FF9F6B;
  --c-lagoon:#6FD6C6;
  --c-lilac:#C4A6FF;
  --c-sun:#FFD36B;
  --c-sky:#7CC4FF;
  --c-rose:#FF7A8E;
  --font-display:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--space)}
body{
  background:var(--space);
  background-image:
    radial-gradient(120% 60% at 85% -10%, #1B2550 0%, transparent 60%),
    radial-gradient(90% 50% at 0% 100%, #141B3E 0%, transparent 65%);
  background-attachment:fixed;
  color:var(--fg);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  min-height:100%;
  padding-block:0 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:14px}
::selection{background:#2A3A78;color:#fff}

header{padding-block:40px 28px;position:relative}
.planet{
  position:absolute;
  right:-6px;top:22px;
  width:104px;height:auto;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:.14em;
  color:var(--muted);
  margin:0 0 14px;
  text-transform:uppercase;
}
h1{
  font-family:var(--font-display);
  font-stretch:118%;
  font-weight:800;
  font-size:clamp(30px,9.4vw,44px);
  line-height:1.12;
  letter-spacing:-.01em;
  margin:0;
  max-width:11ch;
  text-wrap:balance;
}
.lede{margin:14px 0 0;color:var(--muted);font-size:14px;max-width:30ch}

.grid{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.tile{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:64px;
  height:100%;
  padding:10px 12px;
  border-radius:16px;
  background:linear-gradient(165deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);
  transition:transform .16s ease,border-color .16s ease;
}
.tile:hover,.tile:active{transform:translateY(-2px);border-color:var(--accent)}
.orb{
  flex:none;
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  font-size:23px;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--c) 28%,transparent) 0%, color-mix(in srgb,var(--c) 8%,transparent) 70%);
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 28%,transparent);
}
.meta{min-width:0;flex:1}
.name{
  font-weight:700;
  font-size:14.5px;
  line-height:1.3;
  overflow-wrap:anywhere;
  word-break:keep-all;
}

footer{
  margin-top:36px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
@media (min-width:420px){
  .tile{padding:10px 14px}
  .planet{width:124px}
}
@media (prefers-reduced-motion: reduce){
  .tile{transition:none}
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>

</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <svg class="planet" viewBox="0 0 120 90" aria-hidden="true">
      <defs>
        <radialGradient id="pg" cx="34%" cy="30%" r="75%">
          <stop offset="0" stop-color="#FFE3B8"/>
          <stop offset=".5" stop-color="#E8905E"/>
          <stop offset="1" stop-color="#4A2A3F"/>
        </radialGradient>
        <clipPath id="front"><rect x="0" y="45" width="120" height="45"/></clipPath>
      </defs>
      <ellipse cx="60" cy="45" rx="56" ry="13" fill="none" stroke="var(--ring)" stroke-width="2" transform="rotate(-18 60 45)" opacity=".55"/>
      <circle cx="60" cy="45" r="26" fill="url(#pg)"/>
      <ellipse cx="60" cy="45" rx="56" ry="13" fill="none" stroke="var(--ring)" stroke-width="2.4" transform="rotate(-18 60 45)" clip-path="url(#front)"/>
    </svg>
    <p class="eyebrow" id="count">LINKS</p>
    <h1>수퍼소닉<br>도구 모음</h1>
    <p class="lede">탭하면 새 탭에서 열립니다.</p>
  </header>

  <ul class="grid" id="grid"></ul>

  <footer>수퍼소닉 도구 모음</footer>
</div>

<script>
/* 박스 버튼 데이터: 새 링크는 이 배열 끝에 한 줄씩 추가하면 아래로 계속 늘어납니다. */
var TOOLS = [
  { name: "우주 메시지 sol",  url: "https://nysc-space-message-sol.vercel.app", icon: "💬", color: "var(--c-ember)" },
  { name: "우주 메시지",       url: "https://nysc-space-message.vercel.app",     icon: "✉️", color: "var(--c-lagoon)" },
  { name: "플라네타리움",      url: "https://nysc-planetarium.vercel.app",       icon: "🌍", color: "var(--c-lilac)" },
  { name: "로켓 45 sol",      url: "https://20260716.vercel.app",               icon: "🚀", color: "var(--c-sun)" },
  { name: "비행기 타겟",       url: "https://nysc-airplane-target.vercel.app",   icon: "✈️", color: "var(--c-sky)" },
  { name: "레볼루션",          url: "https://nysc-revolution.vercel.app",        icon: "🏆", color: "var(--c-rose)" }
];

var grid = document.getElementById("grid");
function host(u){ try { return new URL(u).hostname; } catch (e) { return u; } }
function svgArrow(){
  var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", "14"); s.setAttribute("height", "14"); s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2.2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("aria-hidden", "true");
  var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", "M7 17L17 7M9 7h8v8");
  s.appendChild(p);
  return s;
}
function div(cls, text){ var d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }

TOOLS.forEach(function(t){
  var li = document.createElement("li");
  var a = document.createElement("a");
  a.className = "tile";
  a.href = t.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", t.name + " 열기");
  var orb = div("orb", t.icon); orb.style.setProperty("--c", t.color);
  orb.setAttribute("aria-hidden", "true");
  var meta = div("meta");
  meta.appendChild(div("name", t.name));
  a.appendChild(orb);
  a.appendChild(meta);
  li.appendChild(a);
  grid.appendChild(li);
});
document.getElementById("count").textContent = "LINKS · " + String(TOOLS.length).padStart(2, "0");

/* 별 배경 */
(function(){
  var cv = document.getElementById("stars");
  var ctx = cv.getContext("2d");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stars = [], w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function seed(){
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round((w * h) / 5200);
    stars = [];
    for (var i = 0; i < n; i++){
      stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .25, p: Math.random() * 6.28, s: Math.random() * .0016 + .0004 });
    }
  }
  function draw(t){
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var a = reduce ? .6 : .35 + .55 * (.5 + .5 * Math.sin(s.p + t * s.s));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#E9EDFB";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  seed(); draw(0);
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ seed(); if (reduce) draw(0); }, 150); });
})();
</script>
</body>
</html>
